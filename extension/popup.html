<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenDL</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e24;
      color: #f0f0f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #33333d;
      padding-bottom: 10px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      color: #00d26a;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #00d26a; }
    input:checked + .slider:before { transform: translateX(16px); }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      background: #2a2a35;
      color: #aaa;
    }
    .status-badge.online { background: #004d26; color: #00ff80; }
    button {
      width: 100%;
      padding: 8px;
      background: #00d26a;
      border: none;
      border-radius: 6px;
      color: #111;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: #00b85c; }
    .info-box {
      margin-top: 10px;
      padding: 8px;
      background: #141418;
      border-radius: 4px;
      font-size: 11px;
      color: #888;
      word-break: break-all;
    }
    .error-text {
      color: #f87171;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">OpenDL</div>
    <span id="hostStatus" class="status-badge">Checking...</span>
  </div>
  <div class="row">
    <span>Capture Downloads</span>
    <label class="switch">
      <input type="checkbox" id="toggleIntercept" checked>
      <span class="slider"></span>
    </label>
  </div>
  <button id="testPing">Test Host Connection</button>

  <div class="info-box">
    <div><strong>Extension ID:</strong> <span id="extId">-</span></div>
    <div id="errorDetails" class="error-text"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
