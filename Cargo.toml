[workspace]
members = [
    "crates/opendl-engine",
    "crates/opendl-core",
    "crates/opendl-native-host",
    "crates/opendl-cli",
    "crates/opendl-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenDL Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
bytes = "1.10"
futures-util = "0.3"
indicatif = { version = "0.17", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
parking_lot = "0.12"
async-trait = "0.1"
